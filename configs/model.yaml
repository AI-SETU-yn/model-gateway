models:
  erp:
    model_name: ${MODEL_GATEWAY_ERP_MODEL_NAME:qwen-erp}
    base_model: ${MODEL_GATEWAY_ERP_BASE_MODEL:Qwen/Qwen2.5-1.5B-Instruct}
    provider:
      type: ${MODEL_GATEWAY_ERP_PROVIDER:vllm}
      api_base: ${MODEL_GATEWAY_ERP_API_BASE:http://127.0.0.1:4000/v1}
      api_key: ${MODEL_GATEWAY_ERP_API_KEY:local}
      deployment_name: ${MODEL_GATEWAY_ERP_DEPLOYMENT:qwen-erp}
      timeout_seconds: 90.0
    adapter_enabled: true
    default_adapter: academic
    adapters_root: adapters
    device: remote
    dtype: remote
    trust_remote_code: true
    prompts:
      planner: |
        You are the ERP Planner model for YN Setu.
        Return only valid JSON.
        Extract the user's business intent, tool hint, and parameters.
        Do not include markdown.
      generator: |
        You are the YN Setu enterprise assistant.
        Answer using only supplied enterprise tool results when tool results are available.
        Never invent business data, names, identifiers, dates, counts, or statuses.
        Never ask for information that is already present in the supplied data.
        Ignore orchestration metadata such as planner intents, tool names, server names, trace IDs, latency, and debug fields.
        Produce concise, professional enterprise responses.
    generation:
      max_new_tokens: 128
      temperature: 0.1
      top_p: 0.9
      do_sample: false
      repetition_penalty: 1.05
      planner_max_new_tokens: 128
    planner_targets:
      - domain: vidhya
        service: academic
        entity: academic_year
        operation: list
        intent: academic.academic_year.list
        tool: academic.get_all_academic_years_by_branch_id
        description: Fetches all academic years for a branch.
        keywords:
          - academic year
          - academic years
          - current academic year
        response_type: structured
      - domain: vidhya
        service: academic
        entity: holiday
        operation: list
        intent: academic.holiday.list
        tool: academic.get_all_holi_days
        description: Fetches holidays for an academic year.
        keywords:
          - holiday
          - holidays
          - holiday calendar
        response_type: structured
  general:
    model_name: ${MODEL_GATEWAY_GENERAL_MODEL_NAME:qwen-general}
    base_model: ${MODEL_GATEWAY_GENERAL_BASE_MODEL:Qwen/Qwen2.5-1.5B-Instruct}
    provider:
      type: ${MODEL_GATEWAY_GENERAL_PROVIDER:vllm}
      api_base: ${MODEL_GATEWAY_GENERAL_API_BASE:http://127.0.0.1:4000/v1}
      api_key: ${MODEL_GATEWAY_GENERAL_API_KEY:local}
      deployment_name: ${MODEL_GATEWAY_GENERAL_DEPLOYMENT:qwen-general}
      timeout_seconds: 90.0
    adapter_enabled: false
    adapters_root: adapters
    device: remote
    dtype: remote
    trust_remote_code: true
    prompts:
      chat: |
        You are a helpful enterprise AI assistant.
      security: |
        You are an enterprise AI security classifier.
        Classify only.
        Never answer the user.
        Return JSON only.
    generation:
      max_new_tokens: 256
      temperature: 0.2
      top_p: 0.9
      do_sample: false
      repetition_penalty: 1.0
      planner_max_new_tokens: 128
routing:
  planner_model: erp
  generate_model: erp
  security_model: general
  general_chat_model: general
